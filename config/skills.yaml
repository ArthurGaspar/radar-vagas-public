# Dicionário usado no score de compatibilidade.
#
# Formato:  NomeExibido: [sinônimo1, sinônimo2, ...]
# Só os sinônimos são procurados no texto (o nome é o que aparece no Discord),
# então inclua a forma minúscula também: Python: [python]. Os grupos são só
# organização.
#
# O score é: dos termos deste dicionário que aparecem na VAGA, quantos % também
# aparecem no seu CURRÍCULO. Termos fora do dicionário são ignorados, então se
# uma vaga pede algo que você sabe e que não está aqui, acrescente.

